services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operations
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: operations_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  api:
    build: ./server
    environment:
      PORT: 3001
      DATABASE_URL: postgres://operations:operations_dev@db:5432/operations
    ports:
      - "3001:3001"
    depends_on:
      - db
  client:
    build: ./client
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
