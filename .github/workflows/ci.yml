name: CI
on: [push, pull_request]
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: server
        run: npm install
      - working-directory: server
        run: npm test
      - working-directory: client
        run: npm install
      - working-directory: client
        run: npm run build
